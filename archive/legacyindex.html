<!DOCTYPE html><html><head>
    <meta charset="UTF-8">
    <title>OMIKUJI // MASTER_CORE_v36.2_DEFAULT_MPC_SWING</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @font-face { font-family: 'NIN'; src: url('nin.ttf'); } 
        @font-face { font-family: 'DATA'; src: url('data.ttf'); }
        
        :root {
            --bg-dark: #0a0a0a;
            --chassis-bg: #222222;
            --panel-bg: #151515;
            --c-dim: #666666;
            --c-bright: #e0e0e0; 
            --c-glow: 0 0 8px rgba(224, 224, 224, 0.3);
            --text-color: #b0b0b0;
            --accent: #ff5500; /* Groovebox Orange Contrast */
            --accent-glow: 0 0 12px rgba(255, 85, 0, 0.7);
            --accent-rgb: 255, 85, 0;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'NIN', monospace;
            /* Carbon Fiber Hex Texture */
            background: 
                radial-gradient(black 15%, transparent 16%) 0 0,
                radial-gradient(black 15%, transparent 16%) 8px 8px,
                radial-gradient(rgba(255,255,255,.03) 15%, transparent 20%) 0 1px,
                radial-gradient(rgba(255,255,255,.03) 15%, transparent 20%) 8px 9px;
            background-color: #111;
            background-size: 16px 16px;
            
            color: var(--text-color);
            padding: 20px;
            text-transform: uppercase;
            user-select: none;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        
        /* Gunmetal Chassis Gradient */
        #chassis {
            width: 1044px;
            height: 95vh;
            background: linear-gradient(135deg, #333333 0%, #1a1a1a 100%);
            border-radius: 4px;
            border: 1px solid #444;
            padding: 15px;
            box-shadow: 15px 15px 40px rgba(0,0,0,0.9), inset 1px 1px 2px rgba(255,255,255,0.15);
            color: var(--c-bright);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* SCREWS */
        .screw {
            position: absolute; width: 12px; height: 12px;
            background: linear-gradient(135deg, #555, #222); border-radius: 50%;
            border: 1px solid #111;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2), 1px 1px 3px rgba(0,0,0,0.8);
            z-index: 20;
        }
        .screw::after { content: ''; position: absolute; top: 2px; left: 5px; width: 2px; height: 8px; background: #111; opacity: 0.8; }
        .screw::before { content: ''; position: absolute; top: 5px; left: 2px; width: 8px; height: 2px; background: #111; opacity: 0.8; }
        .tl { top: 6px; left: 6px; transform: rotate(45deg); }
        .tr { top: 6px; right: 6px; transform: rotate(15deg); }
        .bl { bottom: 6px; left: 6px; transform: rotate(-20deg); }
        .br { bottom: 6px; right: 6px; transform: rotate(60deg); }

        /* Recessed Panels */
        .panel-fixed {
            background: var(--panel-bg);
            border-radius: 2px;
            border-top: 1px solid #0a0a0a;
            border-left: 1px solid #0a0a0a;
            border-bottom: 1px solid #333;
            border-right: 1px solid #333;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.8);
            padding: 8px;
            flex-shrink: 0;
            z-index: 10;
        }
        .mb { margin-bottom: 10px; }
        .data-font { font-family: 'DATA', monospace; font-size: 10px; letter-spacing: 1px; color: var(--c-dim); text-shadow:none; }
        
        /* Low Border-Radius Square Buttons */
        button {
            font-family: 'DATA', monospace; 
            background: linear-gradient(180deg, #3a3a3a, #222);
            color: var(--c-bright); 
            border: 1px solid #111;
            border-radius: 2px;
            box-shadow: inset 1px 1px 1px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5);
            cursor: pointer; padding: 5px 10px; font-size: 11px; transition: 0.05s;
        }
        button:hover {
            background: linear-gradient(180deg, #444, #2a2a2a);
            color: #fff;
        }
        button:active, .btn-active {
            background: #1a1a1a;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.8);
            border-color: #000;
            transform: translateY(1px);
        }
        
        input[type=range] { accent-color: var(--c-bright); width: 100%; background:transparent; }
        input { background: var(--bg-dark); color: var(--c-bright); border: 1px solid var(--c-dim); }

        /* --- DROPDOWN MENUS --- */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; right: 0; top: 100%; margin-top: 4px;
            background-color: var(--panel-bg); min-width: 120px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.8); z-index: 100;
            border: 1px solid var(--c-dim);
        }
        .dropdown-content button {
            width: 100%; border: none; border-bottom: 1px solid var(--chassis-bg); 
            text-align: left; padding: 8px 12px; font-size: 10px; border-radius:0; box-shadow:none;
        }
        .dropdown-content button:last-child { border-bottom: none; }
        .dropdown-content button:hover { background-color: var(--c-dim); color: #111; }
        .show { display: block; }

        /* --- 3D SCENE & FLIPPER ARCHITECTURE --- */
        .scene {
            perspective: 1500px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            margin-bottom: 10px;
            position: relative;
        }
        .flipper {
            width: 100%; height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1.2); 
            transform-style: preserve-3d;
        }
        .flipper.flip-fx { transform: rotateY(180deg); }
        .flipper-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; 
            display: flex; flex-direction: column;
            pointer-events: none; 
        }
        .flipper-face.active-face { pointer-events: auto; }
        .flipper-face-back { transform: rotateY(180deg); }

        #page-seq { perspective: 1200px; }
        
        #rack, #fx-rack {
              flex-grow: 1; overflow-y: auto; overflow-x: hidden;
              background: var(--bg-dark);
              border-top: 2px solid #000; border-left: 2px solid #000;
              border-bottom: 1px solid #333; border-right: 1px solid #333;
              box-shadow: inset 4px 4px 15px rgba(0,0,0,0.9);
              padding: 4px; height: 100%;
              transform-origin: center; 
        }

        #rack::-webkit-scrollbar, #fx-rack::-webkit-scrollbar { width: 8px; }
        #rack::-webkit-scrollbar-track, #fx-rack::-webkit-scrollbar-track { background: var(--bg-dark); }
        #rack::-webkit-scrollbar-thumb, #fx-rack::-webkit-scrollbar-thumb { background: var(--c-dim); border: 1px solid var(--bg-dark); }

        .step-grid { display: flex; gap: 3px; } 
        .step-col { width: 50px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }
        
        /* RAISED RUBBER STEPS */
        .step { 
            height: 20px; 
            border-radius: 3px; 
            border: 1px solid #000;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.15), 0 3px 5px rgba(0,0,0,0.7);
            cursor: pointer; 
            background: linear-gradient(180deg, #3a3a3a, #282828); 
            width: 50px; 
            transition: all 0.05s ease; 
        }
        .step:hover {
            background: linear-gradient(180deg, #444, #333);
        }
        
        .step-on {
            background: var(--accent) !important;
            border-color: #ff8844 !important;
            box-shadow: inset 1px 2px 5px rgba(0,0,0,0.6), 0 0 10px var(--accent) !important;
            transform: translateY(2px);
        }

        .v-box { height: 35px; border-radius:2px; border: 1px solid #111; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8); position: relative; cursor: ns-resize; width: 50px; background:#1a1a1a; overflow:hidden;}
        .v-bar { position: absolute; bottom: 0; width: 100%; background: var(--c-bright); pointer-events: none; opacity: 0.5; }
        
        .piano-drawer { display:none; background:var(--bg-dark); border-top:1px solid var(--c-dim); margin-top:5px; padding:5px; box-shadow:inset 0 0 10px rgba(0,0,0,0.5); }
        .piano-key { height: 14px; border: 1px solid #111; border-radius:2px; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.6); cursor: pointer; font-size: 7px; display: flex; align-items: center; justify-content: center; background: #222; color: var(--c-dim); width: 50px; margin-bottom:1px; transition: background 0.05s; }
        
        .key-active { background: var(--accent) !important; color: #111 !important; border-color: #ffaa88 !important; box-shadow: 0 0 8px var(--accent-glow); }
        
        #monitor-panel { background: var(--bg-dark); color: var(--c-bright); padding: 10px; height: 30px; font-family: 'DATA', monospace; font-size: 9px; overflow-y: auto; border-top: 1px solid var(--c-dim); flex-shrink: 0; box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); }
        
        .song-block { width:30px; height:30px; border:1px solid #111; border-radius:2px; box-shadow:inset 1px 1px 1px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:'DATA', monospace; font-size:10px; font-weight:bold; background:linear-gradient(180deg, #3a3a3a, #222); color:var(--c-dim); }
        
        .fx-slot { border: 1px solid var(--c-dim); margin-bottom: 10px; background: var(--panel-bg); color: var(--c-bright); }
        .bpm-btn { padding: 2px 5px; font-size: 8px; line-height: 1; }
        
        .arr-ctrl { display: flex; flex-direction: column; gap: 2px; margin-right: 8px; justify-content: center; border-right: 1px solid #111; padding-right: 8px; box-shadow: 1px 0 0 rgba(255,255,255,0.05); }
        .arr-btn { width: 30px; height: 14px; font-size: 9px; padding: 0; display: flex; align-items: center; justify-content: center; }
        
        .del-btn { color: #f8b1b1; border-color: #855; font-weight: bold; padding: 2px 6px; }
        .del-btn:hover { background: #f8b1b1 !important; color: #111 !important; border-color: #f8b1b1 !important; box-shadow: 0 0 10px #f8b1b1; }

        .track-row { display:flex; gap:8px; align-items:flex-start; padding:4px; border-bottom:1px solid #111; background:var(--panel-bg); transition: background 0.1s, border-color 0.1s; box-shadow: 0 1px 0 rgba(255,255,255,0.02); }
        
        .track-row.drag-over {
            background: rgba(var(--accent-rgb), 0.1) !important; 
            border-color: var(--accent) !important;
            box-shadow: inset 0 0 15px rgba(var(--accent-rgb), 0.2);
        }

        .track-controls { width:120px; flex-shrink:0; display:flex; flex-direction:column; gap:3px; }
        .ctrl-row { display:flex; justify-content:space-between; align-items:center; }
        .tiny-btn { padding: 2px 6px; font-size: 9px; }
        .file-name { font-size:8px; color:var(--c-bright); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; text-shadow: 0 0 2px rgba(224, 224, 224, 0.3); }
        
        select { background: var(--bg-dark); color: var(--c-bright); border: 1px solid var(--c-dim); border-radius:2px; }

        #playhead-gutter { display: flex; gap: 3px; padding: 0 4px; margin: 5px 0 0 132px; height: 10px; flex-shrink: 0; }
        .led { width: 50px; height: 4px; background: #111; border-radius: 2px; transition: background 0.05s, box-shadow 0.05s; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.8); }
        .led-active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

        #sampler-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95);
            z-index: 200;
            display: none;
            align-items: center; justify-content: center;
        }
        .sampler-box {
            width: 600px; max-width: 95vw; 
            background: var(--chassis-bg);
            border: 2px solid var(--c-dim);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            padding: 20px;
            display: flex; flex-direction: column; gap: 10px;
            position: relative;
        }
        .sampler-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111; padding-bottom: 10px; margin-bottom: 10px; box-shadow: 0 1px 0 rgba(255,255,255,0.05); }
        
        .cvs-wrap { width: 100%; height: 150px; background:var(--bg-dark); border: 1px solid #000; box-shadow:inset 2px 2px 10px rgba(0,0,0,0.8); position: relative; }
        canvas { display: block; width: 100%; height: 100%; }

        .param-row { display: flex; gap: 20px; margin-top: 10px; }
        .param-group { border: 1px solid #111; background:#1a1a1a; padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 5px; box-shadow:inset 1px 1px 5px rgba(0,0,0,0.5); }
        .p-label { font-size: 9px; color: var(--c-dim); margin-bottom: 2px; display: flex; justify-content: space-between; }
        
        /* SAMPLE PILLAR CSS */
        .folder-item { cursor: pointer; color: var(--c-bright); padding: 4px 0; display:flex; align-items:center; gap:5px;}
        .folder-item:hover { background: rgba(255,255,255,0.05); }
        .file-item { cursor: pointer; color: var(--text-color); padding: 4px 0; margin-left:15px; display:flex; align-items:center; gap:5px; border-left:1px solid #333; padding-left:5px;}
        .file-item:hover { color: var(--accent); background: rgba(var(--accent-rgb), 0.05); }
    </style>
</head>
<body>

<div id="sample-browser" style="display:none; position:absolute; top:40px; right:40px; width:280px; height:75vh; background:linear-gradient(135deg, #2a2a2a, #1a1a1a); border:2px solid #444; box-shadow:10px 10px 30px rgba(0,0,0,0.9); z-index:999; flex-direction:column; border-radius:2px;">
    <div id="sb-header" style="padding:8px 12px; background:#111; cursor:move; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #444;">
        <div class="data-font" style="color:var(--c-bright); font-size:11px;">SAMPLE_PILLAR</div>
        <div style="display:flex; gap:5px;">
            <button onclick="openSampleDirectory()" style="padding:2px 5px; box-shadow:none;">+ FOLDER</button>
            <button onclick="toggleSampleBrowser()" style="background:#441111; color:#ff4444; border-color:#ff4444; padding:2px 5px; box-shadow:none;">X</button>
        </div>
    </div>
    <div id="sb-content" style="flex:1; overflow-y:auto; overflow-x:hidden; padding:10px; font-size:10px; font-family:'DATA', monospace;">
        </div>
</div>

<div id="sampler-overlay">
    <div class="sampler-box">
        <div class="sampler-header">
            <div class="data-font" style="font-size: 14px; color: var(--c-bright)">SAMPLER CONSOLE</div>
            <div style="display:flex; gap:10px">
                <button onclick="previewNote()" style="width:40px; border-color:var(--c-bright); background:var(--c-dim); color:#fff;">[ T ]</button>
                <button onclick="closeSampler()" style="background:#441111; color:#ff4444; border-color:#ff4444">CLOSE</button>
            </div>
        </div>
        
        <div class="cvs-wrap">
            <canvas id="waveCanvas" width="560" height="150"></canvas>
        </div>

        <div class="data-font" id="smp-info" style="text-align: right; margin-top: 5px;">NO_SAMPLE_LOADED</div>
        
        <div class="param-row">
            <div class="param-group">
                <div class="data-font" style="color:var(--text-color); border-bottom:1px solid #333; margin-bottom:5px">FILTER (24dB)</div>
                <div class="p-label"><span>CUTOFF</span><span id="val-cut">20k</span></div>
                <input type="range" id="sl-cut" min="0" max="1" step="0.001" oninput="updSmpParams()">
                <div class="p-label"><span>RES</span><span id="val-res">0</span></div>
                <input type="range" id="sl-res" min="0" max="20" step="0.1" oninput="updSmpParams()">
            </div>
            <div class="param-group">
                <div class="data-font" style="color:var(--text-color); border-bottom:1px solid #333; margin-bottom:5px">ENVELOPE (ADSR)</div>
                <div class="p-label"><span>ATTACK</span><span id="val-att">0</span></div>
                <input type="range" id="sl-att" min="0" max="1" step="0.001" oninput="updSmpParams()">
                <div class="p-label"><span>DECAY</span><span id="val-dec">0</span></div>
                <input type="range" id="sl-dec" min="0" max="1" step="0.001" oninput="updSmpParams()">
                <div class="p-label"><span>SUSTAIN</span><span id="val-sus">0</span></div>
                <input type="range" id="sl-sus" min="0" max="1" step="0.01" oninput="updSmpParams()">
                <div class="p-label"><span>RELEASE</span><span id="val-rel">0</span></div>
                <input type="range" id="sl-rel" min="0" max="1" step="0.001" oninput="updSmpParams()">
            </div>
        </div>
    </div>
</div>

<div id="chassis">
    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <div class="panel-fixed mb" style="display:flex;justify-content:space-between;align-items:center; padding:5px 10px; overflow:visible; z-index: 50; position: relative;">
        <div style="display:flex;gap:10px;align-items:center">
            <button id="pB" onclick="play()" style="font-size: 14px; padding: 5px 15px;">PLAY</button>
            <button id="mB" onclick="m=1-m;mB.innerText=m?'MODE:SONG':'MODE:PAT';up()">MODE:PAT</button>
            
            <div class="data-font" style="display:flex; align-items:center; gap:4px; margin-left: 5px; border-left: 2px solid #111; padding-left: 10px; box-shadow: -1px 0 0 rgba(255,255,255,0.05);">
                BPM 
                <input id="bpm" value="120" style="width:35px; text-align:center" onchange="markDirty()">
                <div style="display:flex; flex-direction:column; gap:1px">
                    <button class="bpm-btn" onmousedown="startBpm(1,event)" onmouseup="stopBpm()" onmouseleave="stopBpm()">▲</button>
                    <button class="bpm-btn" onmousedown="startBpm(-1,event)" onmouseup="stopBpm()" onmouseleave="stopBpm()">▼</button>
                </div>
            </div>
        </div>
        
        <div style="display:flex;gap:15px;align-items:center">
            
            <button onclick="toggleSampleBrowser()" style="font-weight: bold; margin-right: -5px;" title="Sample Pillar">SP</button>

            <button onclick="addT()" style="font-weight: bold;">+ ADD TRACK</button>

            <div class="dropdown">
                <button onclick="closeDropdowns(); document.getElementById('editDropdown').classList.toggle('show'); event.stopPropagation();" style="font-weight:bold;">
                    EDIT ▼
                </button>
                <div id="editDropdown" class="dropdown-content">
                    <button onclick="copyP(); closeDropdowns();">COPY PATTERN</button>
                    <button onclick="pasteP(); closeDropdowns();">PASTE PATTERN</button>
                    <button onclick="genPat(); closeDropdowns();" style="color: var(--c-bright); font-weight: bold;">GEN RANDOM</button>
                </div>
            </div>

            <div class="dropdown">
                <button onclick="closeDropdowns(); document.getElementById('fileDropdown').classList.toggle('show'); event.stopPropagation();" style="font-weight:bold;">
                    FILE ▼
                </button>
                <div id="fileDropdown" class="dropdown-content">
                    <button onclick="exportSession(); closeDropdowns();">SAVE PROJECT</button>
                    <button onclick="$('loader').click(); closeDropdowns();">LOAD PROJECT</button>
                </div>
            </div>
            <input type="file" id="loader" style="display:none" onchange="importSession(event)">

            <div class="tabs" style="display:flex; gap:2px;">
                <button id="tSeq" style="background:#1a1a1a; border-color:#000;" onclick="tab('seq')">SEQ</button>
                <button id="tFx" onclick="tab('fx')">FX</button>
            </div>
        </div>
    </div>

    <div class="scene">
        <div id="main-flipper" class="flipper">
            
            <div id="page-seq" class="flipper-face active-face">
                <div class="panel-fixed" style="padding-bottom:5px; margin-bottom:0; border-bottom:0">
                    <div class="data-font">ARRANGER_MATRIX</div>
                    <div id="song-slots" style="display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; align-items:center"></div>
                </div>
                
                <div id="pattern-nav" style="display:flex; gap:5px; height:20px; background:var(--bg-dark); border-left:2px solid #000; border-right:2px solid #000; padding:2px; flex-shrink:0; margin-bottom: 4px; box-shadow:inset 0 2px 5px rgba(0,0,0,0.8);"></div>

                <div id="rack"></div>
                
                <div id="playhead-gutter"></div>
            </div>

            <div id="page-fx" class="flipper-face flipper-face-back">
                <div class="panel-fixed" style="margin-bottom:5px; flex-shrink:0">
                    <button onclick="$('pluginLoader').click()">+ INJECT MACHINE</button>
                    <input type="file" id="pluginLoader" style="display:none" onchange="injectPlugin(event)">
                </div>
                <div id="fx-rack">
                    <div id="pluginUI"></div>
                </div>
            </div>

        </div>
    </div>

    <div class="panel-fixed mb" style="display:grid;grid-template-columns:1fr 1fr;gap:20px; padding:5px 10px">
        <div>
            <div class="data-font">MASTER / SWING (MPC60 / VOLCA TRIPLETS)</div>
            <input type="range" min="0" max="1.5" step="0.01" value="1" id="mVol" oninput="markDirty(); if(mG)mG.gain.value=this.value">
            <div style="display:flex; gap:10px; margin-top:5px; align-items:center">
                <input type="range" id="swAmt" min="0" max="1" step="0.01" value="0" oninput="markDirty()">
                <button onclick="$('swLdr').click()" class="tiny-btn">LOAD_SWING</button>
                <input type="file" id="swLdr" style="display:none" onchange="loadSwing(event)">
            </div>
        </div>
        <div>
            <div class="data-font">RECORDER</div>
            <div style="display:flex; gap:5px">
                <button id="armB" onclick="armRec()">ARM REC</button>
                <button id="expB" style="display:none" onclick="exportWav()">SAVE .WAV</button>
            </div>
            <audio id="prev" controls style="display:none; height:20px; margin-top:5px; width:100%"></audio>
        </div>
    </div>

    <div id="monitor-panel"><div id="log-out">> OMIKUJI_SYSTEM_READY</div></div>
</div>

<script>
/** ENGINE CORE **/
let ctx, b=0, m=0, cur=0, nxt=0, S=[0,0,1,1], tID, si=0, run=0, mG, dest, rec, chunks=[], armed=0, isRec=0, clip=null;

/* DEFAULT HARDWARE SWING ENGINE: MPC60 / Volca Sample style 16th Triplet Shuffle */
let swingEngine = {
    name: "MPC60 / VOLCA TRIPLETS",
    // s = step index (0-15), a = swing amount (0.0 to 1.0)
    // Delays every odd 16th note by up to 1/3 of a 16th duration (66.7% triplet shuffle)
    getOffset: (s, a) => (s % 2 === 1 ? a * (1 / 3) : 0)
};

let swingCodeStore = ""; let activeTrackEdit = -1; let samplerCanvas, samplerCtx, cacheCanvas, cacheCtx;
let samplerPlayStart = 0, samplerPlayDur = 0, samplerAnimID;

let tracks = [];
let patterns = Array.from({length:8},()=>[]); 
    let window_fxR = []; // <-- ADDED THIS LINE TO MONKEY PATCH SYSTEM
let isDirty = false;
const markDirty = () => { isDirty = true; };
const SYS_KEY = "OMIKUJI_CORE_V33_SECRET_KEY"; 
const _xor = (txt) => { let res = ""; for(let i=0; i<txt.length; i++) res += String.fromCharCode(txt.charCodeAt(i) ^ SYS_KEY.charCodeAt(i % SYS_KEY.length)); return res;};
const encodeSys = (obj) => { try { return btoa(_xor(JSON.stringify(obj))); } catch(e) { return null; }};
const decodeSys = (str) => { try { return JSON.parse(_xor(atob(str))); } catch(e) { throw new Error("CORRUPT"); }};
window.addEventListener('beforeunload', (e) => { if (isDirty) { e.preventDefault(); e.returnValue = ''; }});

// Global close dropdowns helper

};

const NOTES = ["C", "B", "A#", "A", "G#", "G", "F#", "F", "E", "D#", "D", "C#", "C"];
const $=id=>document.getElementById(id);
const log=msg=>{$('log-out').innerHTML+=`<div>${msg}</div>`;$('monitor-panel').scrollTop=9999};

const initA=async()=>{ 
    if(!ctx) {
        ctx = new AudioContext();
        mG = ctx.createGain(); mG.connect(ctx.destination);
        dest = ctx.createMediaStreamDestination(); mG.connect(dest);
        rec = new MediaRecorder(dest.stream); 
        rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
        rec.onstop=()=>{let blob=new Blob(chunks,{type:'audio/wav'}); $('prev').src=URL.createObjectURL(blob); $('prev').style.display=$('expB').style.display='block';};
        
        samplerCanvas = $('waveCanvas');
        samplerCtx = samplerCanvas.getContext('2d');
        cacheCanvas = document.createElement('canvas');
        cacheCanvas.width = 560; cacheCanvas.height = 150;
        cacheCtx = cacheCanvas.getContext('2d');
        log(`> AUDIO_CORE_INITIALIZED (DEFAULT SWING: ${swingEngine.name})`);
    }
    if(ctx.state === 'suspended') await ctx.resume();
};

/* --- BPM ACCELERATION FIX --- */
let bpmTmr, bpmInt;
const startBpm = (val, e) => {
    let step = (e && e.shiftKey) ? 5 : 1;
    adjBPMVal(val * step);
    bpmTmr = setTimeout(() => {
        bpmInt = setInterval(() => adjBPMVal(val * step), 50);
    }, 300);
};
const stopBpm = () => { clearTimeout(bpmTmr); clearInterval(bpmInt); };
const adjBPMVal = (change) => { 
    markDirty(); 
    let el = $('bpm'); 
    let nv = parseInt(el.value) + change;
    el.value = Math.max(1, Math.min(999, nv)); 
};

async function loadSwing(e) {
    markDirty();
    let f = e.target.files[0]; if (!f) return;
    try {
        swingCodeStore = await f.text(); 
        const blob = new Blob([swingCodeStore], { type: 'text/javascript' });
        const url = URL.createObjectURL(blob);
        const mod = await import(url + '#' + Date.now());
        swingEngine = mod.default || mod;
        log(`SWING ENGINE OVERRIDDEN: ${swingEngine.name}`);
    } catch (err) { log(`SWING ERROR: ${err.message}`); }
}

const triggerTrackSound = (t, freq, time, vel) => {
    let fx = window_fxR.find(f => f.id === t.route);
    if (fx && typeof fx.noteOn === 'function') {
        fx.noteOn(freq, time, vel);
    }
    if(!t.buf) return null; 

    let envGain = ctx.createGain(); envGain.gain.value = 0;
    
    let filt1 = ctx.createBiquadFilter();
    let filt2 = ctx.createBiquadFilter();
    let qVal = t.filter.res;

    filt1.type = "lowpass"; filt1.frequency.value = t.filter.cut; filt1.Q.value = qVal;
    filt2.type = "lowpass"; filt2.frequency.value = t.filter.cut; filt2.Q.value = qVal;
    
    envGain.connect(t.vV); 
    t.vV.disconnect(); 
    if(fx && fx.input){ 
        t.vV.connect(fx.input); 
    } else {
        t.vV.connect(mG); 
    }
    
    if(t.activeSources.length){ 
        t.activeSources.forEach(s=>{try{s.source.stop(time)}catch(e){}}); 
        t.activeSources=[]; 
    }
    
    let s=ctx.createBufferSource(); 
    s.buffer=t.buf; s.playbackRate.setValueAtTime(freq/65.41,time);
    let velGain = ctx.createGain(); velGain.gain.value = vel; 
    
    s.connect(velGain); 
    velGain.connect(filt1);
    filt1.connect(filt2); 
    filt2.connect(envGain);
    
    let a=t.env.a, d=t.env.d, sus=t.env.s;
    envGain.gain.setValueAtTime(0, time);
    envGain.gain.linearRampToValueAtTime(1, time + a);
    envGain.gain.exponentialRampToValueAtTime(Math.max(0.001, sus), time + a + d);
    s.start(time); 
    
    let voiceObj = { source: s, env: envGain, f1: filt1, f2: filt2 };
    t.activeSources.push(voiceObj);
    return voiceObj;
};

const sch=()=>{
    if(!run) return;
    let bpmVal=parseFloat($('bpm').value);
    let secPerStep = 60 / bpmVal / 4; 
    while(nxt < ctx.currentTime + 0.1){
        if(m&&cur===0){ b=S[si]; si=(si+1)%S.length; } 
        let off = swingEngine.getOffset(cur, parseFloat($('swAmt').value)) * secPerStep;
        let time = nxt + off;
        
        if(patterns[b]){
            tracks.forEach((t, idx)=>{
                if(patterns[b][idx]) {
                    let st = patterns[b][idx][cur];
                    if(st && st.on){
                        triggerTrackSound(t, st.freq, time, st.v);
                        if(idx === activeTrackEdit) {
                            samplerPlayStart = time;
                            samplerPlayDur = t.buf ? t.buf.duration * (65.41/st.freq) : 0;
                        }
                    }
                }
            });
        }
        
        setTimeout(up, Math.max(0, (nxt-ctx.currentTime)*1000)); 
        
        nxt+=secPerStep; cur=(cur+1)%16;
    }
    tID=setTimeout(sch,25);
};

const play=async()=>{
    await initA(); run=!run; 
    let btn = $('pB');
    if(run) { btn.classList.add('btn-active'); btn.style.color = "var(--accent)"; } 
    else { btn.classList.remove('btn-active'); btn.style.color = "var(--c-bright)"; }
    if(run){ if(armed){chunks=[]; rec.start(); isRec=1;} cur=0; si=0; nxt=ctx.currentTime; sch(); }
    else { 
        if(isRec){rec.stop(); isRec=0; armed=0; $('armB').innerText="ARM REC"; $('armB').style.color="var(--c-bright)";} 
        clearTimeout(tID); mG.gain.setTargetAtTime(0,ctx.currentTime,0.05); 
        setTimeout(()=>{
            mG.gain.value=$('mVol').value;
            tracks.forEach(t=>{ 
                t.activeSources.forEach(s=>{try{s.source.stop()}catch(e){}}); 
                t.activeSources=[]; 
            });
        },100); up(); 
    }
};

window.removeFX = (idx) => {
    markDirty(); const fx = window_fxR[idx]; if (!fx) return;
    tracks.forEach(t => { if(t.route === fx.id) t.route = "MASTER"; });
    try { if(fx.input) fx.input.disconnect(); if(fx.output) fx.output.disconnect(); } catch(e){}
    window_fxR.splice(idx, 1); renderFX(); updateTD();
};

const renderFX = () => {
    let ui=$('pluginUI'); ui.innerHTML = window_fxR.length ? '' : '<div class="data-font">> NO MACHINES</div>';
    window_fxR.forEach((f, i) => {
        let d=document.createElement('div'); d.className="fx-slot";
        if(f.renderUI) f.renderUI(d, i);
        else d.innerHTML=`<div class="data-font" style="padding:10px; display:flex; justify-content:space-between"><span>${f.name}</span> <button onclick="removeFX(${i})">DEL</button></div>`;
        ui.appendChild(d);
    });
};

const exportSession=async()=>{
    const zip=new JSZip();
    const proj={
        version: 36,
        bpm:$('bpm').value, S, mVol:$('mVol').value, mode: m, 
        swing: { val: $('swAmt').value, code: swingCodeStore },
        fx:window_fxR.map(f=>({id:f.id,name:f.name,code:f._originalCode,state:f.getState?f.getState():{}})),
        tracks: tracks.map(t=>({
            oct:t.oct, route:t.route, fileName:t.fileName, vol:t.vV.gain.value, filter: t.filter, env: t.env
        })),
        patterns: patterns
    };
    
    const securedData = encodeSys(proj);
    if(!securedData) { log("EXPORT_ERROR: ENCRYPTION_FAILED"); return; }
    zip.file("sys_core.bin", securedData); 
    tracks.forEach(t=>{if(t.rawBlob)zip.file(`samples/${t.fileName}`,t.rawBlob);});
    const b=await zip.generateAsync({type:"blob"});
    const l=document.createElement('a'); l.href=URL.createObjectURL(b); l.download=`SESSION.omikuji`; l.click();
    isDirty = false; log("> SESSION_SECURED_AND_SAVED");
};

async function importSession(e) {
    await initA(); let f=e.target.files[0]; if(!f) return;
    log("AUTHENTICATING SESSION DATA...");
    try {
        const zip = await JSZip.loadAsync(f); let proj;
        if (zip.file("sys_core.bin")) { let encrypted = await zip.file("sys_core.bin").async("string"); proj = decodeSys(encrypted); } 
        else if (zip.file("project.json")) { log("WARNING: LEGACY_FORMAT_DETECTED"); proj = JSON.parse(await zip.file("project.json").async("string")); } 
        else { throw new Error("INVALID_FILE_STRUCTURE"); }
        
        tracks = [];
        patterns = Array.from({length:8},()=>[]);
        window_fxR = [];
        
        if(!proj.version || proj.version < 34) {
            log("> MIGRATING LEGACY PROJECT...");
            let legacyBanks = proj.banks || []; 
            let refPattern = legacyBanks[0] || [];
            for(let i=0; i<refPattern.length; i++) {
                let pT = refPattern[i];
                let track = createTrackObj();
                track.oct = pT.oct; track.route = pT.route; track.fileName = pT.fileName; track.vV.gain.value = pT.vol;
                track.filter = pT.filter || {cut: 20000, res: 0}; track.env = pT.env || {a: 0.005, d: 0.1, s: 1, r: 0.1};
                let sFile = zip.file(`samples/${pT.fileName}`);
                if(sFile){ track.rawBlob = await sFile.async("blob"); track.buf = await ctx.decodeAudioData(await track.rawBlob.arrayBuffer()); }
                tracks.push(track);
            }
            for(let pi=0; pi<8; pi++) {
                if(legacyBanks[pi]) {
                    legacyBanks[pi].forEach((t, ti) => {
                        if(!patterns[pi][ti]) patterns[pi][ti] = []; 
                        patterns[pi][ti] = t.s; 
                    });
                }
            }
        } 
        else {
            for(let i=0; i<proj.tracks.length; i++) {
                let tData = proj.tracks[i];
                let track = createTrackObj();
                track.oct = tData.oct; track.route = tData.route; track.fileName = tData.fileName; track.vV.gain.value = tData.vol;
                track.filter = tData.filter; track.env = tData.env;
                let sFile = zip.file(`samples/${tData.fileName}`);
                if(sFile){ track.rawBlob = await sFile.async("blob"); track.buf = await ctx.decodeAudioData(await track.rawBlob.arrayBuffer()); }
                tracks.push(track);
            }
            patterns = proj.patterns;
        }

        if(proj.mode !== undefined) { m = proj.mode; $('mB').innerText = m ? 'MODE:SONG' : 'MODE:PAT'; }
        if(proj.swing) {
            $('swAmt').value = proj.swing.val;
            if(proj.swing.code) {
                swingCodeStore = proj.swing.code;
                const blob = new Blob([swingCodeStore], { type: 'text/javascript' });
                const url = URL.createObjectURL(blob);
                const mod = await import(url + '#' + Date.now());
                swingEngine = mod.default || mod;
            }
        }
        for(let fx of proj.fx){ let ins = await _inject(fx.code, fx.name, fx.id); if(ins.setState) ins.setState(fx.state); }
        
        S=proj.S; $('bpm').value=proj.bpm; $('mVol').value=proj.mVol;
        renderRack(); renderFX(); updateTD(); up(); isDirty = false; log("SESSION LOADED.");
    } catch(err) { log(`IMPORT ERROR: ${err.message}`); console.error(err); }
}

const createTrackObj = () => {
    return {
        buf:null, rawBlob:null, fileName:"NO_SAMPLE", vV:ctx.createGain(), route:"MASTER", activeSources:[],
        filter: { cut: 20000, res: 0 }, env: { a: 0.005, d: 0.1, s: 1, r: 0.1 }, oct: 2
    };
};

const drS=()=>{
    let controls = `<div class="arr-ctrl"><button class="arr-btn" onclick="markDirty(); S.push(0);up()">+</button><button class="arr-btn" onclick="markDirty(); S.pop();up()" style="color:var(--c-dim)">-</button></div>`;
    let blocks = S.map((p,i)=>`<div class="song-block" style="background:${(m&&run&&si-1==i)?'var(--accent)':'linear-gradient(180deg, #3a3a3a, #222)'};color:${(m&&run&&si-1==i)?'#111':'var(--c-dim)'};border-color:${(m&&run&&si-1==i)?'#ffaa88':'#111'}; box-shadow:${(m&&run&&si-1==i)?'0 0 10px var(--accent-glow)':'inset 1px 1px 1px rgba(255,255,255,0.1)'}" onclick="markDirty(); S[${i}]=(S[${i}]+1)%8;up()">P${p+1}</div>`).join('');
    $('song-slots').innerHTML = controls + blocks;
};

let isFlipping = false;
const switchPat = (newB) => {
    if(b === newB || isFlipping) return;
    isFlipping = true;
    markDirty();
    
    b = newB; 
    $('pattern-nav').innerHTML=[0,1,2,3,4,5,6,7].map(i=>`<button onclick="switchPat(${i})" style="flex:1;background:${b==i?'var(--panel-bg)':'transparent'};color:${b==i?'var(--accent)':'var(--c-dim)'}; padding:2px; font-size:10px; border:none; box-shadow:${b==i?'inset 1px 1px 2px rgba(0,0,0,0.8)':'none'}; border-radius:0;">${i+1}</button>`).join('');

    let r = $('rack');
    r.style.transition = 'transform 0.1s ease-in, opacity 0.1s ease';
    r.style.transform = 'rotateX(90deg)';
    r.style.opacity = '0.3';
    
    setTimeout(() => {
        up(); 
        
        r.style.transition = 'none';
        r.style.transform = 'rotateX(-90deg)';
        void r.offsetWidth; 
        
        r.style.transition = 'transform 0.1s ease-out, opacity 0.1s ease';
        r.style.transform = 'rotateX(0deg)';
        r.style.opacity = '1';
        
        setTimeout(() => { isFlipping = false; }, 100);
    }, 100);
};

const up=()=>{
    $('pattern-nav').innerHTML=[0,1,2,3,4,5,6,7].map(i=>`<button onclick="switchPat(${i})" style="flex:1;background:${b==i?'var(--panel-bg)':'transparent'};color:${b==i?'var(--accent)':'var(--c-dim)'}; padding:2px; font-size:10px; border:none; box-shadow:${b==i?'inset 1px 1px 2px rgba(0,0,0,0.8)':'none'}; border-radius:0;">${i+1}</button>`).join('');
    
    for(let j=0; j<16; j++) { let l = $(`led-${j}`); if(l) { if(cur === j && run) l.classList.add('led-active'); else l.classList.remove('led-active'); } }
    
    if(patterns[b]){
        tracks.forEach((t,ti)=>{
            for(let i=0;i<16;i++){
                if(!patterns[b][ti]) patterns[b][ti] = Array.from({length:16},()=>({on:0,v:0.8,freq:65.41}));
                let st=patterns[b][ti][i];
                let el=$(`s-${ti}-${i}`);
                if(el){
                    if(st.on) {
                        el.classList.add('step-on');
                        el.style.background = ''; 
                    } else {
                        el.classList.remove('step-on');
                        el.style.background = i % 4 == 0 ? "linear-gradient(180deg, #333, #222)" : "linear-gradient(180deg, #3a3a3a, #282828)";
                    }
                    $(`v-bar-${ti}-${i}`).style.height=(st.v*100)+"%"; $(`v-bar-${ti}-${i}`).style.opacity=st.on?1:0.2;
                }
            }
        });
    }
    drS();
};

const renderPiano=(ti)=>{
    let g=$(`pg-${ti}`); g.innerHTML=''; let oct=tracks[ti].oct;
    for(let j=0;j<16;j++){
        let col=document.createElement('div'); col.className="step-col";
        if(!patterns[b][ti]) patterns[b][ti] = Array.from({length:16},()=>({on:0,v:0.8,freq:65.41}));
        let currentNote = patterns[b][ti][j];
        NOTES.forEach(n=>{
            let m=([24,23,22,21,20,19,18,17,16,15,14,13,12][NOTES.indexOf(n)])+(oct*12);
            let f=440*Math.pow(2,(m-69)/12);
            let fFix = parseFloat(f.toFixed(2));
            let k=document.createElement('div'); k.className=`piano-key pk-${ti}-${j}`; 
            if(currentNote.on && Math.abs(currentNote.freq - fFix) < 0.1) k.classList.add('key-active');
            k.innerText=n+(oct+1);
            k.onclick=(e)=>{ markDirty(); e.stopPropagation(); if(currentNote.on && Math.abs(currentNote.freq - fFix) < 0.1) patterns[b][ti][j].on = 0; else { patterns[b][ti][j].freq=fFix; patterns[b][ti][j].on=1; } up(); renderPiano(ti); }; 
            col.appendChild(k);
        });
        g.appendChild(col);
    }
};

const renderRack=()=>{
    let r=$('rack'); r.innerHTML='';
    tracks.forEach((t,i)=>{
        let d=document.createElement('div'); 
        d.className="track-row";

        d.ondragover = (e) => {
              e.preventDefault();
              d.classList.add('drag-over');
          };
        d.ondragleave = (e) => {
              e.preventDefault();
              d.classList.remove('drag-over');
          };
        d.ondrop = async (e) => {
            e.preventDefault();
            d.classList.remove('drag-over');
            
            let f = e.dataTransfer.files[0] || window.draggedSampleFile;
            window.draggedSampleFile = null;
            if(!f) return;
            
            markDirty();
            await initA(); 
            
            try {
                let decoded = await ctx.decodeAudioData(await f.arrayBuffer());
                tracks[i].buf = decoded;
                tracks[i].fileName = f.name.toUpperCase();
                tracks[i].rawBlob = f;
                renderRack();
                if(activeTrackEdit == i) openSampler(i);
                log(`> SAMPLE_LOADED: ${tracks[i].fileName}`);
            } catch (err) {
                log(`> LOAD_ERROR: INVALID_AUDIO_DATA`);
            }
        };

        d.innerHTML=`
        <div class="track-controls">
            <div class="ctrl-row">
                <span class="data-font" style="font-weight:bold; color:var(--text-color);">T${i+1}</span>
                <div>
                    <button class="tiny-btn" onclick="openSampler(${i})">W</button>
                    <button class="tiny-btn" onclick="toggleP(${i})">P</button>
                    <button class="tiny-btn del-btn" onclick="remT(${i}, event)">X</button>
                </div>
            </div>
            <div class="file-name" title="${t.fileName}">${t.fileName}</div>
            <div class="ctrl-row" style="gap:2px">
                <button onclick="this.nextElementSibling.click()" class="tiny-btn" style="flex:1">L</button>
                <input type="file" style="display:none" onchange="ld(${i},event)">
                <select class="route-select" style="width:60px; height:15px; font-size:9px" onchange="markDirty(); tracks[${i}].route=this.value"></select>
            </div>
            <input type="range" min="0" max="1" step="0.01" value="${t.vV.gain.value}" oninput="markDirty(); tracks[${i}].vV.gain.value=this.value" style="height:10px; margin-top:2px">
        </div>
        <div style="flex:1">
            <div class="step-grid" id="steps-${i}"></div>
            <div class="step-grid" style="margin-top:2px" id="vels-${i}"></div>
            <div id="piano-${i}" class="piano-drawer">
                <div class="data-font">OCTAVE: <input type="range" min="0" max="6" step="1" value="${t.oct}" oninput="markDirty(); tracks[${i}].oct=parseInt(this.value);renderPiano(${i});up()"></div>
                <div class="step-grid" id="pg-${i}" style="margin-top:8px"></div>
            </div>
        </div>`;
        r.appendChild(d);
        
        for(let j=0;j<16;j++){
            let c1=document.createElement('div'); c1.className="step-col"; 
            let s=document.createElement('div'); s.id=`s-${i}-${j}`; s.className="step"; 
            s.onclick=()=>{markDirty(); patterns[b][i][j].on=1-patterns[b][i][j].on; up(); renderPiano(i);}; 
            c1.appendChild(s); $(`steps-${i}`).appendChild(c1);
            
            let c2=document.createElement('div'); c2.className="step-col"; 
            let v=document.createElement('div'); v.className="v-box"; 
            v.innerHTML=`<div id="v-bar-${i}-${j}" class="v-bar"></div>`;
            
            v.onmousedown = e => {
                markDirty(); 
                let rect = v.getBoundingClientRect();
                
                const updateVel = (clientY) => {
                    patterns[b][i][j].v = Math.max(0, Math.min(1, 1 - ((clientY - rect.top) / rect.height))); 
                    up(); 
                };
                
                updateVel(e.clientY);
                
                const onMove = ev => updateVel(ev.clientY);
                
                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            }; 
            
            c2.appendChild(v); $(`vels-${i}`).appendChild(c2);
        }
        renderPiano(i);
    });
    
    let gutter = $('playhead-gutter'); gutter.innerHTML = '';
    for(let j=0; j<16; j++) { let led = document.createElement('div'); led.id = `led-${j}`; led.className = 'led'; gutter.appendChild(led); }
    updateTD(); up();
};

const addT=()=>{ 
    markDirty(); initA(); 
    tracks.push(createTrackObj());
    patterns.forEach(pat => { pat.push(Array.from({length:16},()=>({on:0,v:0.8,freq:65.41}))); });
    renderRack(); 
};

const remT=(idx, e)=>{ 
    markDirty(); if(e) e.stopPropagation(); let i = parseInt(idx); 
    if(tracks[i].activeSources) tracks[i].activeSources.forEach(s=>{try{s.source.stop()}catch(e){}});
    tracks.splice(i,1);
    patterns.forEach(pat => { if(pat[i]) pat.splice(i,1); });
    renderRack(); 
};

const openSampler = (idx) => {
    activeTrackEdit = idx;
    $('sampler-overlay').style.display = 'flex';
    let t = tracks[idx];
    $('smp-info').innerText = t.fileName;
    $('sl-cut').value = t.filter.cut / 20000; $('val-cut').innerText = t.filter.cut > 1000 ? (t.filter.cut/1000).toFixed(1)+'k' : Math.floor(t.filter.cut);
    $('sl-res').value = t.filter.res; $('val-res').innerText = t.filter.res;
    $('sl-att').value = Math.sqrt(t.env.a / 2); $('val-att').innerText = t.env.a.toFixed(3);
    $('sl-dec').value = Math.sqrt(t.env.d / 2); $('val-dec').innerText = t.env.d.toFixed(3);
    $('sl-sus').value = t.env.s; $('val-sus').innerText = t.env.s.toFixed(2);
    $('sl-rel').value = Math.sqrt(t.env.r / 5); $('val-rel').innerText = t.env.r.toFixed(3);
    cacheWave(t.buf);
    samplerAnimID = requestAnimationFrame(samplerAnimate);
};

const closeSampler = () => {
    $('sampler-overlay').style.display = 'none';
    activeTrackEdit = -1;
    cancelAnimationFrame(samplerAnimID);
};

const previewNote = () => {
    if(activeTrackEdit < 0) return;
    initA();
    let t = tracks[activeTrackEdit];
    let result = triggerTrackSound(t, 65.41, ctx.currentTime, 1.0);
    if(result && result.env) {
        let sampleDur = t.buf ? t.buf.duration : 0.5;
        let releaseStart = ctx.currentTime + sampleDur;
        result.env.gain.cancelScheduledValues(releaseStart);
        result.env.gain.setValueAtTime(result.env.gain.value, releaseStart);
        result.env.gain.exponentialRampToValueAtTime(0.001, releaseStart + t.env.r);
    }
    samplerPlayStart = ctx.currentTime;
    samplerPlayDur = t.buf ? t.buf.duration : 0;
};

const updSmpParams = () => {
    if(activeTrackEdit < 0) return;
    markDirty();
    let t = tracks[activeTrackEdit];
    t.filter.cut = parseFloat($('sl-cut').value) * 20000;
    t.filter.res = parseFloat($('sl-res').value);
    t.activeSources.forEach(voice => {
        if(voice.f1) { voice.f1.frequency.setValueAtTime(t.filter.cut, ctx.currentTime); voice.f1.Q.setValueAtTime(t.filter.res, ctx.currentTime); }
        if(voice.f2) { voice.f2.frequency.setValueAtTime(t.filter.cut, ctx.currentTime); voice.f2.Q.setValueAtTime(t.filter.res, ctx.currentTime); }
    });
    t.env.a = Math.pow(parseFloat($('sl-att').value), 2) * 2;
    t.env.d = Math.pow(parseFloat($('sl-dec').value), 2) * 2;
    t.env.s = parseFloat($('sl-sus').value);
    t.env.r = Math.pow(parseFloat($('sl-rel').value), 2) * 5;
    $('val-cut').innerText = t.filter.cut > 1000 ? (t.filter.cut/1000).toFixed(1)+'k' : Math.floor(t.filter.cut);
    $('val-res').innerText = t.filter.res;
    $('val-att').innerText = t.env.a.toFixed(3); 
    $('val-dec').innerText = t.env.d.toFixed(3);
    $('val-sus').innerText = t.env.s.toFixed(2); 
    $('val-rel').innerText = t.env.r.toFixed(3);
};

const cacheWave = (buffer) => {
    cacheCtx.clearRect(0,0,560,150);
    cacheCtx.fillStyle = "#0a0a0a"; cacheCtx.fillRect(0,0,560,150);
    if(!buffer) {
        cacheCtx.fillStyle = "#666666"; cacheCtx.font = "12px DATA"; cacheCtx.fillText("NO AUDIO DATA", 240, 80);
        return;
    }
    const data = buffer.getChannelData(0);
    const step = Math.ceil(data.length / 560);
    const amp = 75;
    cacheCtx.beginPath();
    cacheCtx.strokeStyle = "#ff5500"; cacheCtx.lineWidth = 1;
    for(let i=0; i < 560; i++) {
        let min = 1.0; let max = -1.0;
        for (let j=0; j<step; j++) {
            const datum = data[(i*step)+j]; 
            if (datum < min) min = datum; if (datum > max) max = datum;
        }
        cacheCtx.moveTo(i, (1+min)*amp); cacheCtx.lineTo(i, (1+max)*amp);
    }
    cacheCtx.stroke();
};

const samplerAnimate = () => {
    samplerCtx.drawImage(cacheCanvas, 0, 0);
    if (ctx && samplerPlayDur > 0) {
        let elapsed = ctx.currentTime - samplerPlayStart;
        if(elapsed >= 0 && elapsed < samplerPlayDur) {
            let x = (elapsed / samplerPlayDur) * 560;
            samplerCtx.strokeStyle = "rgba(224, 224, 224, 0.8)";
            samplerCtx.lineWidth = 2;
            samplerCtx.beginPath();
            samplerCtx.moveTo(x, 0);
            samplerCtx.lineTo(x, 150);
            samplerCtx.stroke();
        }
    }
    samplerAnimID = requestAnimationFrame(samplerAnimate);
};

const updateTD=()=>{ document.querySelectorAll('.route-select').forEach((sel,i)=>{ let v=tracks[i].route; sel.innerHTML='<option value="MASTER">MASTER</option>'; window_fxR.forEach(f=>sel.innerHTML+=`<option value="${f.id}">${f.id}</option>`); sel.value=v; }); };
async function _inject(code, name, id=null) { 
    const blob = new Blob([code], { type: 'text/javascript' });
    const mod = await import(URL.createObjectURL(blob) + '#' + Date.now());
    const Cls = mod.default || Object.values(mod)[0];
    const ins = new Cls(ctx);
    ins.id = id || "FX_" + Math.random().toString(36).substr(2, 4).toUpperCase();
    ins.name = name; ins._originalCode = code;
    if (ins.output) ins.output.connect(mG);
    window_fxR.push(ins); renderFX(); return ins; 
}
async function injectPlugin(e) { markDirty(); let f=e.target.files[0]; if(!f)return; let c=await f.text(); await _inject(c, f.name); updateTD(); }
const ld=async(i,e)=>{ markDirty(); let f=e.target.files[0]; if(!f)return; let d=await ctx.decodeAudioData(await f.arrayBuffer()); tracks[i].buf=d; tracks[i].fileName=f.name.toUpperCase(); tracks[i].rawBlob=f; renderRack(); if(activeTrackEdit==i)openSampler(i); };
const armRec=()=>{ initA(); armed=1; chunks=[]; $('armB').innerText="ARMED"; $('armB').style.color="var(--accent)"; };

const pasteP=()=>{ if(!clip)return; markDirty(); patterns[b] = JSON.parse(JSON.stringify(clip)); up(); log(`PASTED TO PATTERN ${b+1}`); };

/* --- PATTERN GENERATOR --- */
const genPat = () => {
    markDirty();
    if(patterns[b]){
        tracks.forEach((t, ti) => {
            let oct = t.oct;
            for(let i=0; i<16; i++){
                let isOn = Math.random() > 0.75 ? 1 : 0; 
                let noteIdx = Math.floor(Math.random() * NOTES.length);
                let noteVal = ([24,23,22,21,20,19,18,17,16,15,14,13,12][noteIdx]) + (oct * 12);
                let f = 440 * Math.pow(2, (noteVal - 69) / 12);
                let v = 0.4 + (Math.random() * 0.6); 
                patterns[b][ti][i] = { on: isOn, v: v, freq: parseFloat(f.toFixed(2)) };
            }
            renderPiano(ti); 
        });
        up();
        log(`> PATTERN ${b+1} GENERATED`);
    }
};

/* --- DRAGGABLE SAMPLE PILLAR --- */
let dirHandle;
let auditionSource = null;
window.draggedSampleFile = null;

let sb = $('sample-browser');
let sbH = $('sb-header');
let isDraggingSB = false;
let sbOffset = [0,0];

function toggleSampleBrowser() {
    sb.style.display = (sb.style.display === 'none' || sb.style.display === '') ? 'flex' : 'none';
}

sbH.onmousedown = (e) => {
    isDraggingSB = true;
    sbOffset = [sb.offsetLeft - e.clientX, sb.offsetTop - e.clientY];
};
window.addEventListener('mouseup', () => { isDraggingSB = false; });
window.addEventListener('dragend', () => { window.draggedSampleFile = null; });
window.addEventListener('mousemove', (e) => {
    if(isDraggingSB) {
        sb.style.left = (e.clientX + sbOffset[0]) + 'px';
        sb.style.top = (e.clientY + sbOffset[1]) + 'px';
        sb.style.right = 'auto';
    }
});

async function openSampleDirectory() {
    try {
        dirHandle = await window.showDirectoryPicker();
        $('sb-content').innerHTML = '';
        await renderDirectory(dirHandle, $('sb-content'));
        log("> SAMPLE_DIR_LOADED");
    } catch(e) {
        log("> SAMPLE_DIR_ABORTED");
    }
}

async function renderDirectory(handle, parentEl, level = 0) {
    for await (const entry of handle.values()) {
        let div = document.createElement('div');
        div.style.paddingLeft = (level * 5) + 'px';
        
        if (entry.kind === 'directory') {
            let btn = document.createElement('div');
            btn.className = "folder-item";
            btn.innerText = '📁 ' + entry.name;
            
            let childrenDiv = document.createElement('div');
            childrenDiv.style.display = 'none';
            btn.onclick = async () => {
                if (childrenDiv.style.display === 'none') {
                    if (childrenDiv.innerHTML === '') {
                        await renderDirectory(entry, childrenDiv, level + 1);
                    }
                    childrenDiv.style.display = 'block';
                    btn.innerText = '📂 ' + entry.name;
                } else {
                    childrenDiv.style.display = 'none';
                    btn.innerText = '📁 ' + entry.name;
                }
            };
            div.appendChild(btn);
            div.appendChild(childrenDiv);
        } else if (entry.kind === 'file') {
            if (entry.name.match(/\.(wav|mp3|ogg|flac)$/i)) {
                let fDiv = document.createElement('div');
                fDiv.className = "file-item";
                fDiv.innerText = '🎵 ' + entry.name;
                fDiv.draggable = true;
                
                fDiv.onclick = async () => {
                    let file = await entry.getFile();
                    auditionSample(file);
                };
                
                fDiv.ondragstart = async (e) => {
                    window.draggedSampleFile = await entry.getFile();
                };
                
                div.appendChild(fDiv);
            }
        }
        parentEl.appendChild(div);
    }
}

async function auditionSample(file) {
    await initA();
    if (auditionSource) {
        try { auditionSource.stop(); } catch(e){}
    }
    try {
        let arrayBuffer = await file.arrayBuffer();
        let audioBuffer = await ctx.decodeAudioData(arrayBuffer);
        auditionSource = ctx.createBufferSource();
        auditionSource.buffer = audioBuffer;
        auditionSource.connect(mG); 
        auditionSource.start();
        log(`> AUDITIONING: ${file.name}`);
    } catch(e) {
        log("> DECODE_ERROR");
    }
}
